spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${UMBRA_DB_URL}
    username: ${UMBRA_DB_USER}
    password: ${UMBRA_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

umbra:
  jwt:
    secret: dev-nao-usar-em-producao-segredo-local-de-desenvolvimento


spring:
  application:
    name: umbra-api
  profiles:
    active: dev

  flyway:
    enabled: true
    locations: classpath:db/migration

  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: coleta-

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db

logging:
  level:
    root: info

umbra:
  jwt:
    ttl-horas: 2
  coleta:
    contato: ${UMBRA_COLETA_CONTATO}
    habilitada: false
    agenda:
      descoberta:
        itad-api: "0 0 0,6,12,18 * * *"
        steam-api: "0 15 0,6,12,18 * * *"
        kabum-api: "0 45 3,15 * * *"
      refresh: "0 30 0,6,12,18 * * *"
      rodada-inicial: false

itad:
  itad-api:
    api-key: ${ITAD_API_KEY}
    base-url: https://api.isthereanydeal.com

steam:
  steam-api:
    base-url: https://store.steampowered.com/api

kabum:
  kabum-api:
    base-url: https://servicespub.prod.api.aws.grupokabum.com.br

resilience4j:
  ratelimiter:
    instances:
      itad:
        limit-for-period: 1000
        limit-refresh-period: 5m
        timeout-duration: 2s
      steam:
        limit-for-period: 180
        limit-refresh-period: 5m
        timeout-duration: 2s
      kabum:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 5s
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exception-predicate: dev.davidcaetano.umbra_api.coleta.ColetaRetryPredicate
    instances:
      itad:
        base-config: default
      steam:
        base-config: default
      kabum:
        base-config: default
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 3
        minimum-number-of-calls: 3
        failure-rate-threshold: 100
        wait-duration-in-open-state: 5m
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: false
        record-failure-predicate: dev.davidcaetano.umbra_api.coleta.ColetaCircuitBreakerPredicate
    instances:
      itad:
        base-config: default
      steam:
        base-config: default
      kabum:
        base-config: default

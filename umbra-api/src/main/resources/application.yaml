spring:
  application:
    name: umbra-api
  profiles:
    active: dev

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db

logging:
  level:
    root: info

umbra:
  jwt:
    ttl-horas: 2

itad:
  itad-api:
    api-key: ${ITAD_API_KEY}
    base-url: https://api.isthereanydeal.com

resilience4j:
  ratelimiter:
    instances:
      itad:
        limit-for-period: 1000
        limit-refresh-period: 5m
        timeout-duration: 2s
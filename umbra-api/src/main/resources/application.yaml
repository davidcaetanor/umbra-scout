spring:
  application:
    name: umbra-api

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          discord:
            client-id: ${DISCORD_CLIENT_ID}
            client-secret: ${DISCORD_CLIENT_SECRET}
            client-name: Discord
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: identify,email
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
        provider:
          discord:
            authorization-uri: https://discord.com/oauth2/authorize
            token-uri: https://discord.com/api/oauth2/token
            user-info-uri: https://discord.com/api/users/@me
            user-name-attribute: id

  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: coleta-

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db

logging:
  level:
    root: info
    com.github.benmanes.caffeine.cache.LocalAsyncCache: error

umbra:
  jwt:
    ttl-horas: ${UMBRA_JWT_TTL_HORAS:6}
  login-externo:
    retorno-front: ${UMBRA_LOGIN_RETORNO_FRONT}
  coleta:
    contato: ${UMBRA_COLETA_CONTATO}
    habilitada: false
    agenda:
      descoberta:
        itad-api: "0 5 0,6,12,18 * * *"
        steam-api: "0 15 0,6,12,18 * * *"
        kabum-api: "0 45 3,15 * * *"
      refresh: "0 30 0,6,12,18 * * *"
      rodada-inicial: false
    alarme:
      padrao:
        amostra-minima: 10
        limiar-sem-preco-percentual: 20
        margem-cobertura-percentual: 2
        margem-duplicata-percentual: 2
      por-fonte:
        steam-api:
          amostra-minima: 5
          limiar-sem-preco-percentual: 40
    gravacao:
      janela-vivacidade-dias: 90
    ausencia:
      teto-percentual: 20
      confirmacao-horas: 24
    itad:
      paginas-por-rodada: 30
  busca:
    externa:
      teto-global: 400
      teto-por-ip: 15
      janela: 5m
      timeout-conexao: 1s
      timeout-leitura: 2s
      cache-ttl: 6m
      prazo: 4s
      maximo-resultados: 5
  catalogo:
    prazo-da-consulta-segundos: 3
    tentar-de-novo-em: 5s
    qualidade:
      lote: 150
      validade: 7d
  ofertas:
    peso-economia: 0.7
    referencia-economia-centavos: 11342
    destaques: 8
    candidatos-dos-destaques: 100
    validade-dos-destaques: 10m
    hardware:
      peso-economia: 0.4
      peso-percentual: 0.3
      teto-economia-centavos: 50000
  monitoramento:
    dias-para-descontinuado: 180
    externo:
      prazo: 8s
      tentar-de-novo-em: 60s

itad:
  itad-api:
    api-key: ${ITAD_API_KEY}
    base-url: https://api.isthereanydeal.com

steam:
  steam-api:
    base-url: https://store.steampowered.com/api

kabum:
  kabum-api:
    base-url: https://servicespub.prod.api.aws.grupokabum.com.br

viacep:
  base-url: https://viacep.com.br
  timeout-conexao: 1s
  timeout-leitura: 2s

resilience4j:
  ratelimiter:
    instances:
      itad-coleta:
        limit-for-period: 600
        limit-refresh-period: 5m
        timeout-duration: 2s
      itad-busca:
        limit-for-period: 800
        limit-refresh-period: 5m
        timeout-duration: 0
      itad-qualidade:
        limit-for-period: 150
        limit-refresh-period: 5m
        timeout-duration: 2s
      itad-materializacao:
        limit-for-period: 20
        limit-refresh-period: 5m
        timeout-duration: 0
      steam:
        limit-for-period: 180
        limit-refresh-period: 5m
        timeout-duration: 2s
      kabum:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 5s
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exception-predicate: dev.davidcaetano.umbra_api.coleta.ColetaRetryPredicate
    instances:
      itad:
        base-config: default
      steam:
        base-config: default
      kabum:
        base-config: default
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 3
        minimum-number-of-calls: 3
        failure-rate-threshold: 100
        wait-duration-in-open-state: 5m
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: false
        record-failure-predicate: dev.davidcaetano.umbra_api.coleta.ColetaCircuitBreakerPredicate
    instances:
      itad:
        base-config: default
      itad-busca:
        base-config: default
      itad-qualidade:
        base-config: default
      steam:
        base-config: default
      kabum:
        base-config: default

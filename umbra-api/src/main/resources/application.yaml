spring:
  application:
    name: umbra-api

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration

  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: coleta-

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db

logging:
  level:
    root: info
    com.github.benmanes.caffeine.cache.LocalAsyncCache: error

umbra:
  jwt:
    ttl-horas: ${UMBRA_JWT_TTL_HORAS:6}
  coleta:
    contato: ${UMBRA_COLETA_CONTATO}
    habilitada: false
    agenda:
      descoberta:
        itad-api: "0 5 0,6,12,18 * * *"
        steam-api: "0 15 0,6,12,18 * * *"
        kabum-api: "0 45 3,15 * * *"
      refresh: "0 30 0,6,12,18 * * *"
      rodada-inicial: false
    alarme:
      padrao:
        amostra-minima: 10
        limiar-sem-preco-percentual: 20
        margem-cobertura-percentual: 2
        margem-duplicata-percentual: 2
      por-fonte:
        steam-api:
          amostra-minima: 5
          limiar-sem-preco-percentual: 40
    gravacao:
      janela-vivacidade-dias: 90
    ausencia:
      teto-percentual: 20
    itad:
      paginas-por-rodada: 30
  busca:
    externa:
      teto-global: 400
      teto-por-ip: 15
      janela: 5m
      timeout-conexao: 1s
      timeout-leitura: 2s
      cache-ttl: 6m
      prazo: 4s
      maximo-resultados: 5

itad:
  itad-api:
    api-key: ${ITAD_API_KEY}
    base-url: https://api.isthereanydeal.com

steam:
  steam-api:
    base-url: https://store.steampowered.com/api

kabum:
  kabum-api:
    base-url: https://servicespub.prod.api.aws.grupokabum.com.br

viacep:
  base-url: https://viacep.com.br
  timeout-conexao: 1s
  timeout-leitura: 2s

resilience4j:
  ratelimiter:
    instances:
      itad-coleta:
        limit-for-period: 600
        limit-refresh-period: 5m
        timeout-duration: 2s
      itad-busca:
        limit-for-period: 800
        limit-refresh-period: 5m
        timeout-duration: 0
      steam:
        limit-for-period: 180
        limit-refresh-period: 5m
        timeout-duration: 2s
      kabum:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 5s
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exception-predicate: dev.davidcaetano.umbra_api.coleta.ColetaRetryPredicate
    instances:
      itad:
        base-config: default
      steam:
        base-config: default
      kabum:
        base-config: default
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 3
        minimum-number-of-calls: 3
        failure-rate-threshold: 100
        wait-duration-in-open-state: 5m
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: false
        record-failure-predicate: dev.davidcaetano.umbra_api.coleta.ColetaCircuitBreakerPredicate
    instances:
      itad:
        base-config: default
      itad-busca:
        base-config: default
      steam:
        base-config: default
      kabum:
        base-config: default

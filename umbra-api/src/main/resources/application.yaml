spring:
  application:
    name: umbra-api
  profiles:
    active: dev

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db

umbra:
  jwt:
    ttl-horas: 2
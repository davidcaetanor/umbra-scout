<nav aria-label="Principal no celular" class="fixed inset-x-0 bottom-0 z-10 border-t-2 border-filete bg-superficie tablet:hidden">
  <ul class="grid grid-cols-2">
    @for (item of itens; track item.rota) {
      <li class="flex">
        <a
          [routerLink]="item.rota"
          routerLinkActive="ativo"
          ariaCurrentWhenActive="page"
          class="link-barra flex min-h-14 flex-1 flex-col items-center justify-center gap-0.5 text-dado text-texto-secundario"
        >
          @switch (item.icone) {
            @case ('catalogo') {
              <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
            }
            @case ('monitoramentos') {
              <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>
            }
          }
          {{ item.rotuloCurto }}
        </a>
      </li>
    }
  </ul>
</nav>

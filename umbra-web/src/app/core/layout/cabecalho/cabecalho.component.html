<header class="sticky top-0 z-10 border-b-2 border-filete bg-superficie">
  <div class="mx-auto flex h-14 max-w-6xl items-center gap-6 px-4 tablet:h-15 tablet:px-6">
    <a routerLink="/" class="flex min-h-11 items-center gap-2 rounded-controle" aria-label="Umbra, página inicial">
      <img src="marca/umbra-cabeca.png" alt="" width="48" height="48" class="size-12 [image-rendering:pixelated]" />
      <span class="font-titulo text-subtitulo" aria-hidden="true">Umbra</span>
    </a>

    <nav aria-label="Principal" class="hidden h-full tablet:flex">
      <ul class="flex h-full gap-1">
        @for (item of itens; track item.rota) {
          <li class="flex">
            <a
              [routerLink]="item.rota"
              routerLinkActive="ativo"
              ariaCurrentWhenActive="page"
              class="link-navegacao flex items-center px-3 text-interface text-texto-secundario hover:text-texto"
            >
              {{ item.rotulo }}
            </a>
          </li>
        }
      </ul>
    </nav>

    @if (mostrarBusca()) {
      <search class="ms-auto hidden min-w-0 flex-1 justify-end tablet:flex">
        <form class="w-full max-w-64" (submit)="buscar($event, campoDeBusca)">
          <label for="busca-cabecalho" class="sr-only">Buscar no catálogo</label>
          <input
            #campoDeBusca
            id="busca-cabecalho"
            type="search"
            enterkeyhint="search"
            autocomplete="off"
            spellcheck="false"
            minlength="3"
            maxlength="100"
            placeholder="Buscar no catálogo"
            class="min-h-10 w-full rounded-controle border border-borda-campo bg-fundo px-3 text-interface"
          />
        </form>
      </search>
    }

    @if (autenticado()) {
      <div #conta class="relative ms-auto">
        <button
          #botaoDaConta
          type="button"
          class="inline-flex min-h-11 max-w-48 items-center gap-2 botao-secundario px-3 text-interface"
          aria-haspopup="true"
          aria-controls="menu-da-conta"
          [attr.aria-expanded]="menuAberto()"
          [attr.aria-label]="nomeAcessivel()"
          (click)="alternarMenu()"
        >
          <span class="truncate">{{ nomeDaConta() }}</span>
          <svg aria-hidden="true" viewBox="0 0 20 20" class="size-4 shrink-0" fill="currentColor"><path d="M5.3 7.3a1 1 0 0 1 1.4 0L10 10.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 0 1 0-1.4Z"/></svg>
        </button>
        @if (menuAberto()) {
          <div
            id="menu-da-conta"
            class="absolute end-0 top-full z-20 mt-2 w-64 max-w-[calc(100vw-2rem)] rounded-bloco border-2 border-filete bg-superficie-elevada p-2"
          >
            @if (usuario(); as conta) {
              <p class="truncate px-3 py-2 text-apoio text-texto-secundario">{{ conta.email }}</p>
            }
            <a
              routerLink="/conta"
              class="flex min-h-11 w-full items-center rounded-controle px-3 text-interface hover:bg-superficie"
              (click)="fecharMenu()"
            >
              Minha conta
            </a>
            <button
              type="button"
              class="flex min-h-11 w-full items-center rounded-controle px-3 text-start text-interface hover:bg-superficie"
              (click)="sair()"
            >
              Sair
            </button>
          </div>
        }
      </div>
    } @else {
      <a
        routerLink="/entrar"
        class="ms-auto inline-flex min-h-11 items-center botao-secundario px-4 text-interface"
      >
        Entrar
      </a>
    }
  </div>
</header>

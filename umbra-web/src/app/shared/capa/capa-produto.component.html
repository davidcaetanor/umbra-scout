@if (fase() !== 'sem-imagem') {
  <img
    [src]="endereco()"
    [attr.srcset]="alternativas()"
    [attr.sizes]="alternativas() ? tamanhos() : null"
    alt=""
    width="300"
    height="140"
    [attr.loading]="prioritaria() ? 'eager' : 'lazy'"
    decoding="async"
    referrerpolicy="no-referrer"
    class="size-full"
    [class.object-cover]="!emMoldura()"
    [class.object-contain]="emMoldura()"
    [class.p-2]="emMoldura()"
    [class.mix-blend-multiply]="emMoldura()"
    (error)="falhou()"
  />
} @else {
  <svg
    viewBox="0 0 24 24"
    class="h-[30%] w-auto"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <rect x="3" y="4" width="18" height="16" rx="2" />
    <circle cx="8.5" cy="9.5" r="1.5" />
    <path d="M21 16l-5-5-9 9" />
  </svg>
}

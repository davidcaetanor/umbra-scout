<div role="status" aria-live="polite" class="w-full max-w-sm">
  @if (avisos.atual(); as aviso) {
    <div
      class="pointer-events-auto flex items-center gap-3 rounded-bloco border border-filete bg-superficie-elevada py-2 ps-2 pe-1 shadow-lg"
    >
      <img
        [src]="'/mascote/retratos/' + aviso.retrato + '.png'"
        alt=""
        width="48"
        height="48"
        class="size-12 shrink-0 [image-rendering:pixelated]"
      />
      <p class="min-w-0 flex-1 text-interface">{{ aviso.texto }}</p>
      <button
        type="button"
        class="min-h-11 min-w-11 shrink-0 rounded-controle text-texto-secundario hover:text-texto"
        aria-label="Fechar aviso"
        (click)="avisos.fechar()"
      >
        <svg aria-hidden="true" viewBox="0 0 20 20" class="mx-auto size-4" fill="currentColor">
          <path d="m5.5 4.1 4.5 4.5 4.5-4.5 1.4 1.4-4.5 4.5 4.5 4.5-1.4 1.4-4.5-4.5-4.5 4.5-1.4-1.4 4.5-4.5-4.5-4.5z" />
        </svg>
      </button>
    </div>
  }
</div>

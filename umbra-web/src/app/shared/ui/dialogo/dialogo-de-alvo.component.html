<umbra-dialogo
  rotuladoPor="titulo-do-alvo"
  [aberto]="aberto()"
  [ocupado]="enviando()"
  (fechar)="pedirCancelamento()"
>
  <form novalidate (submit)="enviar($event, campo)">
    @if (pedido(); as pedido) {
      <h2 id="titulo-do-alvo" class="line-clamp-2 font-titulo text-subtitulo break-words">{{ pedido.titulo }}</h2>
      @if (pedido.apoio; as apoio) {
        <p class="mt-1 text-apoio text-texto-secundario">{{ apoio }}</p>
      }
    }
    <label for="campo-do-alvo" class="mt-4 block font-medium">{{ pedido()?.rotuloDoCampo }}</label>
    <div
      class="mt-1.5 flex min-h-12 items-center rounded-controle border bg-fundo focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-foco"
      [class.border-borda-campo]="!erro()"
      [class.border-erro]="erro()"
      [class.border-2]="erro()"
    >
      <span class="ps-3 font-mono text-texto-secundario" aria-hidden="true">R$</span>
      <input
        #campo
        id="campo-do-alvo"
        type="text"
        inputmode="decimal"
        autocomplete="off"
        maxlength="14"
        [attr.data-foco-inicial]="focarAcao() ? null : ''"
        [value]="texto()"
        [attr.aria-invalid]="erro() ? 'true' : null"
        [attr.aria-errormessage]="erro() ? 'erro-do-alvo' : null"
        class="min-h-11 w-full min-w-0 flex-1 bg-transparent px-2 font-mono text-valor tabular-nums outline-none"
        (input)="digitar($event)"
      />
    </div>
    @if (erro(); as erro) {
      <p id="erro-do-alvo" role="alert" class="mt-1.5 text-apoio text-erro">{{ erro }}</p>
    }
    <div class="mt-5 flex flex-wrap justify-end gap-2">
      <button type="button" class="min-h-11 botao-secundario px-4" (click)="pedirCancelamento()">Cancelar</button>
      <button
        type="submit"
        class="min-h-11 botao-principal px-5"
        [attr.data-foco-inicial]="focarAcao() ? '' : null"
        [attr.aria-busy]="enviando() || null"
        [attr.aria-disabled]="enviando() || null"
      >
        {{ enviando() ? pedido()?.acaoEmAndamento : pedido()?.acao }}
      </button>
    </div>
  </form>
</umbra-dialogo>

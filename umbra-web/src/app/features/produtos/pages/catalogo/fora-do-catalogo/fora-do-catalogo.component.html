<section class="mt-4 border-t border-filete pt-4" aria-labelledby="fora-do-catalogo">
  <h2 id="fora-do-catalogo" class="font-titulo text-subtitulo">Fora do catálogo</h2>
  <p class="sr-only" role="status" aria-live="polite">{{ anuncio() }}</p>
  <ul class="mt-3 flex flex-col gap-3">
    @for (produto of produtos(); track produto.gid) {
      <li>
        <umbra-card-externo
          [produto]="produto"
          [monitoramento]="estados().get(produto.gid) ?? null"
          (monitorar)="monitorar(produto)"
        />
      </li>
    }
  </ul>
</section>

<umbra-dialogo-de-alvo
  [pedido]="pedidoDeAlvo()"
  [enviando]="enviando()"
  [erroDoServidor]="erro()"
  (salvar)="salvar($event)"
  (cancelar)="cancelar()"
/>

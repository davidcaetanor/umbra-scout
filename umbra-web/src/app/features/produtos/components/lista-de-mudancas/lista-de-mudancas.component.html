<ul class="flex flex-col gap-1.5" aria-label="Mudanças de preço">
  @for (mudanca of visiveis(); track $index) {
    <li class="flex items-baseline gap-3">
      <span class="w-12 shrink-0 font-mono text-dado leading-6 tabular-nums text-texto-secundario">{{ mudanca.data }}<span class="sr-only">{{ separador }}</span></span>
      <span>
        @if (mudanca.menor) {
          <span class="me-1.5 inline-block size-2 rotate-45 bg-texto align-middle" aria-hidden="true"></span>
          <span class="sr-only">Menor preço registrado: </span>
        }
        {{ mudanca.texto }}
      </span>
    </li>
  }
</ul>
@if (temMais()) {
  <button type="button" class="link-texto text-apoio" [attr.aria-expanded]="expandida()" (click)="alternar()">
    {{ expandida() ? 'Ver menos' : 'Ver todas (' + mudancas().length + ')' }}
  </button>
}

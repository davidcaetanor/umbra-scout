<div class="flex flex-col gap-4 min-[30rem]:flex-row min-[30rem]:items-start">
  <umbra-capa-produto
    [capa]="topo().capa"
    tamanhos="(min-width: 30rem) 176px, 100vw"
    [prioritaria]="true"
    class="aspect-square w-full shrink-0 rounded-peca min-[30rem]:w-44"
  />
  <div class="min-w-0 flex-1">
    <p class="text-apoio text-texto-secundario">{{ topo().rotulo }}</p>
    <h1 class="font-titulo text-secao break-words">{{ topo().nome }}</h1>
  </div>
</div>
@if (topo().leitura; as leitura) {
  <umbra-leitura-do-preco [leitura]="leitura" />
}
<ng-content />

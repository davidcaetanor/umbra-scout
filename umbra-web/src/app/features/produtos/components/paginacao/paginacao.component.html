@if (totalDePaginas() > 1) {
  <nav aria-label="Páginas do catálogo" class="flex items-center justify-between gap-3">
    <button
      type="button"
      class="min-h-11 botao-secundario px-4"
      [disabled]="pagina() === 0"
      (click)="irPara.emit(pagina() - 1)"
    >
      Anterior
    </button>
    <p class="text-apoio">Página {{ pagina() + 1 }} de {{ totalDePaginas() }}</p>
    <button
      type="button"
      class="min-h-11 botao-secundario px-4"
      [disabled]="pagina() + 1 >= totalDePaginas()"
      (click)="irPara.emit(pagina() + 1)"
    >
      Próxima
    </button>
  </nav>
}

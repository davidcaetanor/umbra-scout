<article class="flex flex-wrap items-center gap-3 rounded-bloco border border-filete bg-fundo p-3">
  <umbra-capa-produto [imagem]="produto().imagem" tipo="JOGO" class="size-16 shrink-0 overflow-hidden rounded-peca" />
  <div class="flex min-w-0 flex-1 flex-col gap-1">
    <h3 class="break-words text-interface font-medium">{{ produto().nome }}</h3>
    <umbra-preco-produto [preco]="produto().preco" />
  </div>
  <a
    [href]="produto().enderecoDaLoja"
    target="_blank"
    rel="noopener noreferrer"
    class="flex min-h-11 w-full items-center justify-center gap-1 rounded-controle border border-borda-campo px-3 font-medium hover:bg-superficie-elevada tablet:w-auto"
  >
    Ver na loja<span class="sr-only">: {{ produto().nome }}, abre em nova aba</span>
    <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
    </svg>
  </a>
</article>

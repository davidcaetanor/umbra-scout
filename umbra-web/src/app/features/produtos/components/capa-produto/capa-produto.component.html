@if (fase() !== 'sem-imagem') {
  <img
    [src]="endereco()"
    [attr.srcset]="alternativas()"
    [attr.sizes]="alternativas() ? tamanhos() : null"
    alt=""
    width="300"
    height="140"
    [attr.loading]="prioritaria() ? 'eager' : 'lazy'"
    decoding="async"
    referrerpolicy="no-referrer"
    class="size-full object-cover opacity-0 motion-safe:transition-opacity motion-safe:duration-200"
    [class.opacity-100]="carregada()"
    (load)="carregada.set(true)"
    (error)="falhou()"
  />
} @else {
  <svg
    viewBox="0 0 24 24"
    class="size-7"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    @if (tipo() === 'HARDWARE') {
      <rect x="6" y="6" width="12" height="12" rx="1.5" />
      <rect x="9.5" y="9.5" width="5" height="5" />
      <path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3" />
    } @else {
      <path d="M6 8h12a4 4 0 0 1 4 4v1a4 4 0 0 1-7 2.6l-.6-.6H9.6l-.6.6A4 4 0 0 1 2 13v-1a4 4 0 0 1 4-4z" />
      <path d="M7 11v3M5.5 12.5h3M16 11.5h.01M18 13.5h.01" />
    }
  </svg>
}

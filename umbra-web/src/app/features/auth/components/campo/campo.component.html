<div class="flex flex-col gap-1.5">
  <label [for]="idCampo()" class="font-semibold">{{ rotulo() }}</label>
  <div
    class="flex min-h-12 items-center rounded-controle border bg-superficie focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-foco"
    [class.border-borda-campo]="!erro()"
    [class.border-erro]="erro()"
    [class.border-2]="erro()"
  >
    <input
      [id]="idCampo()"
      [type]="tipoEfetivo()"
      [formControl]="controle()"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-invalid]="erro() ? 'true' : null"
      [attr.aria-describedby]="descritoPor()"
      class="min-h-11 w-full min-w-0 flex-1 bg-transparent px-3 text-valor outline-none placeholder:text-texto-secundario"
    />
    @if (ehSenha()) {
      <button
        type="button"
        class="me-1 min-h-11 min-w-11 shrink-0 rounded-controle px-2 text-apoio text-texto-secundario underline hover:text-texto"
        [attr.aria-controls]="idCampo()"
        [attr.aria-pressed]="senhaVisivel()"
        (click)="alternarSenha()"
      >
        {{ senhaVisivel() ? 'Ocultar' : 'Mostrar' }}
      </button>
    }
  </div>
  @if (dica()) {
    <p [id]="idDaDica()" class="text-apoio text-texto-secundario">{{ dica() }}</p>
  }
  @if (erro()) {
    <p [id]="idDoErro()" class="flex items-start gap-1.5 text-apoio text-erro">
      <svg aria-hidden="true" viewBox="0 0 20 20" class="mt-0.5 size-4 shrink-0" fill="currentColor"><path d="M10 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm-.9 4h1.8v5.2H9.1V6Zm0 6.8h1.8v1.8H9.1v-1.8Z"/></svg>
      <span>{{ erro() }}</span>
    </p>
  }
</div>

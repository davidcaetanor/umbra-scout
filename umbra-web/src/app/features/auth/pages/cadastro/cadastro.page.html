<umbra-moldura-entrada>
  <h1 class="font-titulo text-secao">Criar conta</h1>
  <p class="mt-1 mb-6 text-texto-secundario">Grátis. Você define o preço, o Umbra avisa.</p>

  <umbra-botoes-login-externo verbo="Continuar" [provedores]="provedores" [saindo]="saindoPara()" (escolher)="entrarCom($event)" />

  <p class="my-6 flex items-center gap-3 text-apoio text-texto-secundario before:h-px before:flex-1 before:bg-filete after:h-px after:flex-1 after:bg-filete">
    ou com email
  </p>

  <form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate class="flex flex-col gap-4">
    @if (falhou()) {
      <umbra-aviso tipo="erro">{{ 'Não foi possível criar a conta agora. Tente de novo em instantes.' | frasesEmLinhas }}</umbra-aviso>
    }
    <umbra-campo
      idCampo="cadastro-nome"
      rotulo="Nome"
      autocomplete="nickname"
      [controle]="formulario.controls.nome"
      [erro]="mensagem(formulario.controls.nome)"
    />
    <umbra-campo
      idCampo="cadastro-email"
      rotulo="Email"
      tipo="email"
      autocomplete="email"
      [controle]="formulario.controls.email"
      [erro]="mensagem(formulario.controls.email)"
    />
    <umbra-campo
      idCampo="cadastro-senha"
      rotulo="Senha"
      tipo="password"
      autocomplete="new-password"
      [dica]="'Mínimo de ' + minimoDaSenha + ' caracteres.'"
      [controle]="formulario.controls.senha"
      [erro]="mensagem(formulario.controls.senha)"
    />
    <button
      type="submit"
      class="mt-2 inline-flex min-h-12 items-center justify-center gap-2 botao-principal px-4 text-valor"
      [disabled]="enviando()"
      [attr.aria-busy]="enviando() ? 'true' : null"
    >
      @if (enviando()) {
        <svg viewBox="0 0 24 24" class="size-5 motion-safe:animate-spin" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9" /></svg>
      }
      {{ enviando() ? 'Criando conta…' : 'Criar conta' }}
    </button>
  </form>

  <p class="mt-6 text-center text-texto-secundario">
    Já tem conta?
    <a routerLink="/entrar" [queryParams]="{ returnUrl: destino() }" class="inline-flex min-h-6 items-center font-semibold text-texto link-texto">Entrar</a>
  </p>
</umbra-moldura-entrada>

<h1 class="font-titulo text-secao">Minha conta</h1>

<section class="mt-6 max-w-2xl rounded-bloco border-2 border-filete bg-superficie p-4 tablet:p-6" aria-label="Seus dados">
  <umbra-estado-do-bloco [estado]="estado()" (tentarDeNovo)="carregar()">
    <p carregando>Carregando seus dados…</p>
    @if (dados(); as dados) {
      <dl class="grid gap-x-8 gap-y-4 tablet:grid-cols-[max-content_1fr]">
        <dt class="text-apoio text-texto-secundario">Nome</dt>
        <dd class="min-w-0 break-words">{{ dados.nome }}</dd>
        <dt class="text-apoio text-texto-secundario">Email</dt>
        <dd class="min-w-0 break-words">{{ dados.email }}</dd>
        <dt class="text-apoio text-texto-secundario">Região</dt>
        <dd>{{ dados.regiao ?? 'Não informada' }}</dd>
        <dt class="text-apoio text-texto-secundario">No Umbra desde</dt>
        <dd>{{ dados.membroDesde }}</dd>
      </dl>
    }
  </umbra-estado-do-bloco>
</section>

<p class="mt-4 max-w-2xl text-apoio text-texto-secundario">
  <span class="block">Editar seus dados, informar o CEP e excluir a conta chegam em breve.</span>
</p>

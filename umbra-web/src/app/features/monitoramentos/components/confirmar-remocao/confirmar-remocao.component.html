<umbra-dialogo
  papel="alertdialog"
  rotuladoPor="titulo-da-remocao"
  descritoPor="alvo-da-remocao"
  [aberto]="aberto()"
  [ocupado]="removendo()"
  (fechar)="pedirCancelamento()"
>
  @if (pedido(); as pedido) {
    <h2 id="titulo-da-remocao" class="font-titulo text-subtitulo break-words">Remover {{ pedido.nome }}?</h2>
    <p id="alvo-da-remocao" class="mt-1 text-apoio text-texto-secundario">Alvo {{ alvo() }}</p>
  }
  <div class="mt-5 flex flex-wrap justify-end gap-2">
    <button type="button" class="min-h-11 botao-secundario px-4" data-foco-inicial (click)="pedirCancelamento()">Cancelar</button>
    <button
      type="button"
      class="min-h-11 botao-secundario border-erro px-4 text-erro"
      [attr.aria-busy]="removendo() || null"
      [attr.aria-disabled]="removendo() || null"
      (click)="pedirConfirmacao()"
    >
      Remover
    </button>
  </div>
</umbra-dialogo>

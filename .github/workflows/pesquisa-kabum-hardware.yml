name: "Pesquisa de campo — filtro de categoria e árvore de hardware da Kabum"

# Só roda quando você clicar em "Run workflow" na aba Actions.
on:
  workflow_dispatch: {}

jobs:
  pesquisa-kabum:
    runs-on: ubuntu-latest
    steps:
      - name: Descobrir o filtro de categoria certo, depois puxar amostras grandes
        run: |
          set +e   # script de pesquisa: uma falha pontual não pode derrubar a run inteira
          UA="UmbraScoutBot/0.1 (+contato: davidcaetanoribeiro@gmail.com)"
          BASE="https://servicespub.prod.api.aws.grupokabum.com.br/catalog/v2/products"
          mkdir -p resultado

          echo "== baseline, sem filtro nenhum (referência: sabemos que dá 10000) =="
          curl -sS -g -A "$UA" --max-time 20 "$BASE?page_number=1&page_size=1" -o resultado/baseline.json
          echo "total_items_count baseline: $(jq -r '.meta.total_items_count // "erro"' resultado/baseline.json 2>/dev/null)"
          sleep 2

          # -g / --globoff é obrigatório: sem isso o curl tenta interpretar [ ] como range de glob
          # e quebra em qualquer candidato com colchete na URL.
          CANDIDATOS=(
            "category=Hardware"
            "category[]=Hardware"
            "filter[category]=Hardware"
            "filters[category]=Hardware"
            "categories=Hardware"
            "category_name=Hardware"
            "f_category=Hardware"
            "menu=Hardware"
            "category=hardware"
          )

          VENCEDOR=""
          for c in "${CANDIDATOS[@]}"; do
            nome=$(echo "$c" | tr -c 'a-zA-Z0-9' '_')
            echo "== testando: $c =="
            curl -sS -g -A "$UA" --max-time 20 "${BASE}?${c}&page_number=1&page_size=5" -o "resultado/cand_${nome}.json"
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "  curl falhou (código $rc), pulando"
              sleep 2
              continue
            fi
            total=$(jq -r '.meta.total_items_count // "erro"' "resultado/cand_${nome}.json" 2>/dev/null)
            [ -z "$total" ] && total="erro"
            primeiro_menu=$(jq -r '.data[0].attributes.menu // "sem-item"' "resultado/cand_${nome}.json" 2>/dev/null)
            echo "  total_items_count=$total | primeiro menu=$primeiro_menu"
            if [ "$total" != "10000" ] && [ "$total" != "erro" ] && [ "$total" != "0" ] && [ "$total" != "null" ] && [ -z "$VENCEDOR" ]; then
              VENCEDOR="$c"
              echo "  >>> candidato promissor: $c"
            fi
            sleep 2
          done

          echo "$VENCEDOR" > resultado/vencedor.txt
          echo "Vencedor: ${VENCEDOR:-NENHUM CANDIDATO FUNCIONOU}"

          echo "== puxando amostra grande SEM filtro (sempre roda, não depende de achar o filtro) =="
          for pn in 1 2 3 4 5; do
            curl -sS -g -A "$UA" --max-time 20 "${BASE}?page_number=${pn}&page_size=100" -o "resultado/catalogo_geral_pagina_${pn}.json"
            sleep 2
          done

          if [ -n "$VENCEDOR" ]; then
            echo "== filtro encontrado — puxando amostra grande TAMBÉM com o filtro =="
            for pn in 1 2 3 4 5; do
              curl -sS -g -A "$UA" --max-time 20 "${BASE}?${VENCEDOR}&page_number=${pn}&page_size=100" -o "resultado/hardware_filtrado_pagina_${pn}.json"
              sleep 2
            done
          fi

          exit 0   # sempre termina com sucesso — os dados já foram salvos, falha parcial não é falha da run

      - name: Resumo — filtro vencedor e árvore de categorias (menu) encontrada
        if: always()
        run: |
          {
            echo "## Pesquisa de campo — categoria de hardware na Kabum"
            echo
            echo "**Filtro vencedor:** \`$(cat resultado/vencedor.txt 2>/dev/null || echo 'nenhum')\`"
            echo
            echo "### Lista completa de categorias que a API conhece (meta.filters.string_filters)"
            jq -r '.meta.filters.string_filters[]? | select(.name=="category") | .values[]' resultado/cand_category_Hardware_.json resultado/catalogo_geral_pagina_1.json 2>/dev/null | sort -u | sed 's/^/- /' || echo "(não encontrado nesta amostra)"
            echo
            echo "### Valores de 'menu' encontrados, sem filtro (contagem — inclui tudo, não só hardware)"
            for f in resultado/catalogo_geral_pagina_*.json; do
              [ -f "$f" ] || continue
              jq -r '.data[].attributes.menu' "$f" 2>/dev/null
            done | sort | uniq -c | sort -rn | sed 's/^/    /'
            echo
            echo "### Valores de 'menu' encontrados COM o filtro vencedor (se algum funcionou)"
            for f in resultado/hardware_filtrado_pagina_*.json; do
              [ -f "$f" ] || continue
              jq -r '.data[].attributes.menu' "$f" 2>/dev/null
            done | sort | uniq -c | sort -rn | sed 's/^/    /'
            echo
            echo "### Primeiros 10 itens da amostra sem filtro (id, título, menu, preço, disponível)"
            jq -r '.data[] | "- \(.id) | \(.attributes.title) | \(.attributes.menu) | R$\(.attributes.price_with_discount) | disponivel=\(.attributes.available and (.attributes.stock > 0) and (.attributes.price_with_discount > 0))"' resultado/catalogo_geral_pagina_1.json 2>/dev/null | head -10
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guardar todo o JSON cru como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kabum-pesquisa-hardware-${{ github.run_id }}
          path: resultado/
          retention-days: 14
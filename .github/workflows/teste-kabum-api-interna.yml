name: "Teste manual — API interna da Kabum (bloqueio real ou falta de header?)"

# Só roda quando você clicar em "Run workflow" na aba Actions.
on:
  workflow_dispatch: {}

jobs:
  teste-kabum:
    runs-on: ubuntu-latest
    steps:
      - name: Bater no site e na API interna da Kabum a partir do runner (IP de datacenter)
        run: |
          UA="UmbraScoutBot/0.1 (+contato: davidcaetanoribeiro@gmail.com)"
          mkdir -p resultado

          bater() {
            nome="$1"
            url="$2"
            shift 2
            echo "== $nome -> $url =="
            status=$(curl -sS -D "resultado/${nome}.headers.txt" -o "resultado/${nome}.body" \
              -A "$UA" --max-time 20 -w "%{http_code}" "$@" "$url" || echo "ERRO_CURL")
            echo "$status" > "resultado/${nome}.status.txt"
            echo "status: $status"
            echo "--- primeiros 300 bytes do corpo ---"
            head -c 300 "resultado/${nome}.body" 2>/dev/null || true
            echo
            echo "-------------------------------------"
            sleep 2
          }

          # 1. robots.txt do site principal — postura geral de bloqueio
          bater "kabum-robots" "https://www.kabum.com.br/robots.txt"

          # 2. home do site principal — WAF na frente? qual (Cloudflare, CloudFront, Akamai...)?
          bater "kabum-home" "https://www.kabum.com.br/"

          # 3. API interna, requisição mínima — só o nosso UA identificável, nada mais
          bater "kabum-api-minimo" "https://servicespub.prod.api.aws.grupokabum.com.br/catalog/v2/products"

          # 4. mesma API, com headers de contexto que uma chamada AJAX real do próprio site enviaria
          #    (Accept/Referer/Accept-Language honestos sobre o que estamos pedindo — sem trocar o UA)
          bater "kabum-api-com-contexto" "https://servicespub.prod.api.aws.grupokabum.com.br/catalog/v2/products" \
            -H "Accept: application/json" \
            -H "Accept-Language: pt-BR" \
            -H "Referer: https://www.kabum.com.br/"

      - name: Resumo — status, WAF e sinais de bloqueio
        if: always()
        run: |
          {
            echo "## Resultado do teste — API interna da Kabum (runner GitHub Actions = IP de datacenter)"
            echo
            for f in resultado/*.status.txt; do
              nome=$(basename "$f" .status.txt)
              status=$(cat "$f")
              headers="resultado/${nome}.headers.txt"
              body="resultado/${nome}.body"
              server=$(grep -i '^Server:' "$headers" 2>/dev/null | head -1 | tr -d '\r')
              cfray=$(grep -i '^CF-RAY:' "$headers" 2>/dev/null | head -1 | tr -d '\r')
              amzid=$(grep -i '^x-amz-cf-id:\|^X-Amzn-\|^x-amz-apigw-id:' "$headers" 2>/dev/null | head -1 | tr -d '\r')
              bloqueio=$(grep -aio 'cf-chl\|just a moment\|checking your browser\|attention required\|captcha\|access denied\|request blocked\|reference #\|incapsula\|akamai\|forbidden' "$body" 2>/dev/null | sort -u | tr '\n' ',' )
              echo "### $nome"
              echo "- status HTTP: \`$status\`"
              echo "- ${server:-sem header Server}"
              echo "- ${cfray:-sem header CF-RAY}"
              echo "- ${amzid:-sem header AWS/API Gateway}"
              echo "- sinais de bloqueio no corpo: ${bloqueio:-nenhum}"
              echo
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guardar corpo e headers crus como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kabum-teste-${{ github.run_id }}
          path: resultado/
          retention-days: 14

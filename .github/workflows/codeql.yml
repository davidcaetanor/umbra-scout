name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '38 7 * * 6'

permissions:
  contents: read

jobs:
  mudancas:
    name: Linguagens alteradas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      linguagens: ${{ steps.filtro.outputs.linguagens }}
    steps:
      - name: Escolher linguagens pelo caminho
        id: filtro
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          todas='["actions","java-kotlin","javascript-typescript"]'
          if [ "$EVENTO" != "pull_request" ]; then
            echo "linguagens=$todas" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          arquivos=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          if grep -qx '.github/workflows/codeql.yml' <<< "$arquivos"; then
            echo "linguagens=$todas" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          escolhidas=()
          grep -q '^\.github/workflows/' <<< "$arquivos" && escolhidas+=(actions)
          grep -q '^umbra-api/' <<< "$arquivos" && escolhidas+=(java-kotlin)
          grep -q '^umbra-web/' <<< "$arquivos" && escolhidas+=(javascript-typescript)
          echo "linguagens=$(jq -cn '$ARGS.positional' --args "${escolhidas[@]}")" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: mudancas
    if: ${{ needs.mudancas.outputs.linguagens != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.mudancas.outputs.linguagens) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"

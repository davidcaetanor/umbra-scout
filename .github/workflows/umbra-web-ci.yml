name: umbra-web CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['umbra-web/**', 'umbra-api/openapi.json', '.github/workflows/umbra-web-ci.yml']
  push:
    branches: [main]
    paths: ['umbra-web/**', 'umbra-api/openapi.json', '.github/workflows/umbra-web-ci.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: umbra-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: umbra-web/.nvmrc
          cache: npm
          cache-dependency-path: umbra-web/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Gerador da configuracao do conteiner
        run: sh docker/gerar-configuracao.test.sh

      - name: Lint, typecheck, testes e build
        run: npm run verify

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Fontes locais medidas pela reserva
        env:
          GELASIO_URL: https://raw.githubusercontent.com/google/fonts/a60a77e14f28abd4ef243a1b5dfc48df0cec5205/ofl/gelasio/Gelasio%5Bwght%5D.ttf
          GELASIO_SHA256: 4daecea457258c9ebeb8bc99ed3fd24353618bfad3ea4b93fa0b5d0468fc04e4
        run: |
          sudo mkdir -p /usr/local/share/fonts/gelasio
          sudo curl -fsSL --retry 3 "$GELASIO_URL" -o /usr/local/share/fonts/gelasio/Gelasio.ttf
          echo "$GELASIO_SHA256  /usr/local/share/fonts/gelasio/Gelasio.ttf" | sha256sum -c -
          fc-cache -f
          fc-list | grep -E "Gelasio|Liberation Sans" | head -3

      - name: Larguras extremas e roteiro de teclado
        run: npm run e2e

      - name: Publicar capturas e relatorio do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-umbra-web
          path: umbra-web/e2e/resultados/
          if-no-files-found: warn

      - name: Publicar relatorio de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-umbra-web
          path: umbra-web/coverage/
          if-no-files-found: warn

  imagem:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGEM: ghcr.io/davidcaetanor/umbra-web
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcular a tag do commit
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir a imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: umbra-web/Dockerfile
          load: true
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ steps.tag.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=umbra-web
          cache-to: type=gha,mode=max,scope=umbra-web

      - name: Conferir a imagem
        env:
          IMAGEM_COMMIT: ${{ env.IMAGEM }}:${{ steps.tag.outputs.sha }}
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGEM_COMMIT")" = umbra
          docker run -d --name web --read-only \
            --tmpfs /run/umbra:uid=10001,gid=10001 --tmpfs /data:uid=10001,gid=10001 --tmpfs /config:uid=10001,gid=10001 \
            -e UMBRA_WEB_API_URL=https://api.exemplo.com -e UMBRA_WEB_LOGIN_GOOGLE=false \
            -p 127.0.0.1:8081:8080 "$IMAGEM_COMMIT"
          for tentativa in $(seq 1 20); do curl -fsS 127.0.0.1:8081/saude && break; sleep 1; done
          curl -fsS 127.0.0.1:8081/config.json | grep -q '"apiUrl":"https://api.exemplo.com"'
          curl -fsS 127.0.0.1:8081/catalogo | grep -qF '<script id="configuracao" type="application/json">{"apiUrl":"https://api.exemplo.com","loginGoogle":false}</script>'
          curl -fsSI 127.0.0.1:8081/login/callback | grep -qi '^referrer-policy: no-referrer'
          PRINCIPAL=$(curl -fsS 127.0.0.1:8081/ | grep -oE 'main-[A-Za-z0-9_-]{8}\.js' | head -1)
          PEDACO=$(curl -fsS "127.0.0.1:8081/$PRINCIPAL" | grep -oE 'chunk-[A-Za-z0-9_-]{8}\.js' | head -1)
          for versionado in "$PRINCIPAL" "$PEDACO" mascote/v1/retratos/feliz.png marca/v1/umbra-cabeca.png fontes/v1/fraunces-latin-opsz.woff2; do
            curl -fsSI "127.0.0.1:8081/$versionado" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          done
          for sem_versao in / catalogo config.json robots.txt; do
            curl -fsSI "127.0.0.1:8081/$sem_versao" | grep -qi '^cache-control: no-store'
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' 127.0.0.1:8081/imagens/999/itad/a/banner300.jpg)" = 404
          docker rm -f web

      - name: Autenticar no GHCR
        if: ${{ env.PUBLICAR == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar a imagem
        if: ${{ env.PUBLICAR == 'true' }}
        run: docker push --all-tags "$IMAGEM"

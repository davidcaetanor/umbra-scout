name: umbra-api CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['umbra-api/**', 'deploy/**', '.github/workflows/umbra-api-ci.yml']
  push:
    branches: [main]
    paths: ['umbra-api/**', 'deploy/**', '.github/workflows/umbra-api-ci.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: umbra-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build e testes
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Publicar relatorio do JaCoCo
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-umbra-api
          path: umbra-api/target/site/jacoco/
          if-no-files-found: warn

  imagem:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGEM: ghcr.io/davidcaetanor/umbra-api
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcular a tag do commit
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir a imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: umbra-api
          load: true
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ steps.tag.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Conferir a imagem
        env:
          IMAGEM_COMMIT: ${{ env.IMAGEM }}:${{ steps.tag.outputs.sha }}
        run: |
          docker run --rm --entrypoint java "$IMAGEM_COMMIT" -version
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGEM_COMMIT")" = umbra

      - name: Autenticar no GHCR
        if: ${{ env.PUBLICAR == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar a imagem
        if: ${{ env.PUBLICAR == 'true' }}
        run: docker push --all-tags "$IMAGEM"

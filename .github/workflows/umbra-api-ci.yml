name: umbra-api CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['umbra-api/**']
  push:
    branches: [main]
    paths: ['umbra-api/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: umbra-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build e testes
        run: ./mvnw --batch-mode --no-transfer-progress verify

name: umbra-api CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['umbra-api/**', 'deploy/**', '.github/workflows/umbra-api-ci.yml']
  push:
    branches: [main]
    paths: ['umbra-api/**', 'deploy/**', '.github/workflows/umbra-api-ci.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: umbra-api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build e testes
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Publicar relatorio do JaCoCo
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-umbra-api
          path: umbra-api/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar contrato OpenAPI
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-umbra-api
          path: umbra-api/target/openapi.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar relatorio do surefire
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-umbra-api
          path: umbra-api/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Resumo dos testes e da cobertura
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Testes"
            if ls target/surefire-reports/TEST-*.xml > /dev/null 2>&1; then
              grep -h -o '<testsuite [^>]*>' target/surefire-reports/TEST-*.xml | awk '
                { for (i = 1; i <= NF; i++) if (match($i, /^(tests|failures|errors|skipped)="[0-9]+"/)) { split($i, par, "\""); total[substr($i, 1, index($i, "=") - 1)] += par[2] } }
                END { printf "%d testes, %d falhas, %d erros, %d pulados.\n", total["tests"], total["failures"], total["errors"], total["skipped"] }'
            else
              echo "Sem relatorio de testes."
            fi
            echo "## Cobertura de linha (piso de 80%)"
            if [ -f target/site/jacoco/jacoco.csv ]; then
              awk -F, 'NR > 1 { perdidas += $8; cobertas += $9 } END { printf "%.2f%% (%d de %d linhas).\n", 100 * cobertas / (perdidas + cobertas), cobertas, perdidas + cobertas }' target/site/jacoco/jacoco.csv
            else
              echo "Sem relatorio do JaCoCo."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  imagem:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGEM: ghcr.io/davidcaetanor/umbra-api
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Calcular a tag do commit
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir a imagem
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: umbra-api
          load: true
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ steps.tag.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Conferir a imagem
        env:
          IMAGEM_COMMIT: ${{ env.IMAGEM }}:${{ steps.tag.outputs.sha }}
        run: |
          docker run --rm --entrypoint java "$IMAGEM_COMMIT" -version
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGEM_COMMIT")" = umbra

      - name: Autenticar no GHCR
        if: ${{ env.PUBLICAR == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar a imagem
        if: ${{ env.PUBLICAR == 'true' }}
        run: docker push --all-tags "$IMAGEM"

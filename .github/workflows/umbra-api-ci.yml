name: umbra-api CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['umbra-api/**', '.github/workflows/umbra-api-ci.yml']
  push:
    branches: [main]
    paths: ['umbra-api/**', '.github/workflows/umbra-api-ci.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: umbra-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build e testes
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Publicar relatorio do JaCoCo
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-umbra-api
          path: umbra-api/target/site/jacoco/
          if-no-files-found: warn

name: Contrato da API no Pages

on:
  push:
    branches: [main]
    paths: ['umbra-api/openapi.json', 'contrato-api/**', '.github/workflows/contrato-api-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contrato-api-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Montar o site
        run: |
          mkdir -p _site
          cp contrato-api/index.html umbra-api/openapi.json _site/

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v5

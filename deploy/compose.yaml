name: umbra

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${UMBRA_DB_NAME}
      POSTGRES_USER: ${UMBRA_DB_USER}
      POSTGRES_PASSWORD: ${UMBRA_DB_PASSWORD}
    volumes:
      - umbra_pgdata:/var/lib/postgresql
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UMBRA_DB_USER} -d ${UMBRA_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: ghcr.io/davidcaetanor/umbra-api:${UMBRA_IMAGE_TAG:-latest}
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: America/Sao_Paulo
      UMBRA_DB_URL: jdbc:postgresql://postgres:5432/${UMBRA_DB_NAME}
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  web:
    image: ghcr.io/davidcaetanor/umbra-web:${UMBRA_WEB_IMAGE_TAG:-latest}
    environment:
      UMBRA_WEB_API_URL: ${UMBRA_WEB_API_URL}
      UMBRA_WEB_LOGIN_GOOGLE: ${UMBRA_WEB_LOGIN_GOOGLE:-false}
    depends_on:
      - imagens
    ports:
      - "127.0.0.1:8081:8080"
    read_only: true
    tmpfs:
      - /run/umbra:size=1m,uid=10001,gid=10001
      - /data:size=1m,uid=10001,gid=10001
      - /config:size=1m,uid=10001,gid=10001
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  imagens:
    image: darthsim/imgproxy:v4.0.24@sha256:5f3546e097bde5d2c568bf5110c4e3fb4af9bbe2cc5da6390067fda034a88db3
    environment:
      IMGPROXY_ONLY_PRESETS: "true"
      IMGPROXY_PRESETS: capa=quality:75/format:webp,capa-240=resize:fit:240:0/quality:82/format:webp,capa-480=resize:fit:480:0/quality:82/format:webp,capa-600=resize:fit:600:0/quality:82/format:webp
      IMGPROXY_ALLOWED_SOURCES: https://assets.isthereanydeal.com/,https://images.kabum.com.br/
      IMGPROXY_MAX_SRC_RESOLUTION: "2"
      IMGPROXY_MAX_SRC_FILE_SIZE: "2097152"
      IMGPROXY_WORKERS: "2"
      IMGPROXY_TTL: "31536000"
      IMGPROXY_FALLBACK_IMAGE_DATA: 
      IMGPROXY_FALLBACK_IMAGE_HTTP_CODE: "200"
      IMGPROXY_FALLBACK_IMAGE_TTL: "86400"
    read_only: true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  umbra_pgdata:
    name: deploy_umbra_pgdata

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${UMBRA_DB_NAME}
      POSTGRES_USER: ${UMBRA_DB_USER}
      POSTGRES_PASSWORD: ${UMBRA_DB_PASSWORD}
    volumes:
      - umbra_pgdata:/var/lib/postgresql
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UMBRA_DB_USER} -d ${UMBRA_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: ghcr.io/davidcaetanor/umbra-api:${UMBRA_IMAGE_TAG:-latest}
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: America/Sao_Paulo
      UMBRA_DB_URL: jdbc:postgresql://postgres:5432/${UMBRA_DB_NAME}
    ports:
      - "${UMBRA_API_BIND:-127.0.0.1}:8080:8080"
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  umbra_pgdata:
